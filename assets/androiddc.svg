<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AndroidDC">
  <title>AndroidDC</title>
  <desc>A phone whose screen is a row of sliders: device control.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14232B"/>
      <stop offset="1" stop-color="#0F7C8C"/>
    </linearGradient>
  </defs>

  <!-- the tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)"/>

  <!-- the phone -->
  <rect x="152" y="96" width="208" height="320" rx="36" fill="#FFFFFF"/>
  <rect x="172" y="132" width="168" height="248" rx="18" fill="#14232B"/>
  <rect x="228" y="110" width="56" height="10" rx="5" fill="#3A4C55"/>
  <rect x="232" y="392" width="48" height="8" rx="4" fill="#3A4C55"/>

  <!-- three sliders: the control panel -->
  <g fill="#3A4C55">
    <rect x="196" y="180" width="120" height="12" rx="6"/>
    <rect x="196" y="244" width="120" height="12" rx="6"/>
    <rect x="196" y="308" width="120" height="12" rx="6"/>
  </g>
  <g fill="#34E29B">
    <circle cx="280" cy="186" r="17"/>
    <circle cx="232" cy="250" r="17"/>
    <circle cx="262" cy="314" r="17"/>
  </g>
</svg>
