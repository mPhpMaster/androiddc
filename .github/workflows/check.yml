name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parse:
    name: PowerShell parses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every .ps1 must parse
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\backups\\' } |
            ForEach-Object {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                $failed++
                Write-Host "::error file=$($_.Name)::$($errors.Count) parse error(s)"
                foreach ($item in ($errors | Select-Object -First 5)) {
                  Write-Host ("  line {0}: {1}" -f $item.Extent.StartLineNumber, $item.Message)
                }
              } else {
                Write-Host "ok  $($_.Name)"
              }
            }
          if ($failed -gt 0) { exit 1 }

      - name: Every script reads the same on every Windows
        shell: pwsh
        run: |
          # Windows PowerShell 5.1, which the launcher runs, reads a .ps1 with
          # no BOM in the PC's ANSI code page. A non-ASCII letter in such a
          # file therefore means one thing on a UTF-8 PC and another on a 1252
          # or 1256 one. An Arabic word in androiddc.ps1 worked only on the
          # first. So a script either carries a BOM or is plain ASCII.
          $files = @(Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/]backups[\\/]' })
          if ($files.Count -eq 0) {
            Write-Host '::error::no .ps1 found - this check would pass without reading anything'
            exit 1
          }
          $failed = 0
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              Write-Host "ok  $($file.Name) (has a BOM)"
              continue
            }
            $at = [Array]::FindIndex($bytes, [Predicate[byte]] { param($b) $b -gt 127 })
            if ($at -lt 0) { Write-Host "ok  $($file.Name)"; continue }
            $line = [System.Text.Encoding]::ASCII.GetString($bytes, 0, $at).Split("`n").Count
            Write-Host "::error file=$($file.Name),line=$line::a non-ASCII byte in a file with no BOM"
            $failed++
          }
          if ($failed -gt 0) { exit 1 }

      - name: No variable is read before it is assigned
        shell: pwsh
        run: .\.github\audit-variables.ps1

      - name: Every control is shown and every button is wired
        shell: pwsh
        run: .\.github\audit-wiring.ps1

      - name: File navigation and FTP regression checks
        shell: pwsh
        run: .\.github\test-files-navigation.ps1

      - name: Both launchers must point at a file that exists
        shell: pwsh
        run: |
          $pairs = @(
            @{ Vbs = '.\androiddc.vbs'; Pattern = '\\androiddc\.ps1'; Script = '.\androiddc.ps1' },
            @{ Vbs = '.\androiddc-nova.vbs'; Pattern = '\\nova\\androiddc-nova\.ps1'; Script = '.\nova\androiddc-nova.ps1' }
          )
          foreach ($pair in $pairs) {
            if (-not (Test-Path -LiteralPath $pair.Vbs)) { Write-Host "::error::$($pair.Vbs) is missing"; exit 1 }
            $vbs = Get-Content -LiteralPath $pair.Vbs -Raw
            if ($vbs -notmatch $pair.Pattern) { Write-Host "::error::$($pair.Vbs) does not launch $($pair.Script)"; exit 1 }
            if (-not (Test-Path -LiteralPath $pair.Script)) { Write-Host "::error::$($pair.Script) is missing"; exit 1 }
            Write-Host "ok  $($pair.Vbs) -> $($pair.Script)"
          }
          # the Start menu shortcuts point at both launchers by name
          $menu = Get-Content -LiteralPath '.\start-menu.vbs' -Raw
          foreach ($name in @('androiddc.vbs', 'androiddc-nova.vbs')) {
            if ($menu -notmatch [regex]::Escape('"' + $name + '"')) { Write-Host "::error::start-menu.vbs does not make a shortcut to $name"; exit 1 }
          }
          Write-Host 'ok  start-menu.vbs -> both launchers'
          # and its reverse removes the same two shortcuts it makes
          $remove = Get-Content -LiteralPath '.\start-menu-remove.vbs' -Raw
          if ($remove -notmatch [regex]::Escape('Array("AndroidDC", "AndroidDC Nova")') -or
              $menu -notmatch [regex]::Escape('Array("AndroidDC", "AndroidDC Nova")')) {
            Write-Host '::error::start-menu.vbs and start-menu-remove.vbs do not name the same two shortcuts'; exit 1
          }
          Write-Host 'ok  start-menu-remove.vbs removes what start-menu.vbs adds'

      - name: 'AndroidDC Nova: no function twice, XAML well-formed, names prefixed'
        shell: pwsh
        run: |
          # the audit exits with its number of problems; a step must fail on it explicitly
          & .\nova\tests\audit.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: No absolute developer paths in shipped files
        shell: pwsh
        run: |
          $targets = @('.\*.ps1', '.\.github\*.ps1', '.\.github\*.py', '.\tests\*.ps1', '.\tests\*.md',
            '.\*.vbs', '.\*.bat', '.\docs\*.md', '.\README.md',
            '.\nova\*.ps1', '.\nova\*.md', '.\nova\lib\*.ps1', '.\nova\pages\*.ps1', '.\nova\pages\*.xaml',
            '.\nova\ui\*.xaml', '.\nova\tests\*.ps1', '.\shared\*.ps1')

          # A check that reads no files passes exactly as quietly as a clean
          # tree, and SilentlyContinue hides a bad pattern the same way. So
          # prove every group matched something before believing the result.
          foreach ($target in $targets) {
            if (-not (Get-ChildItem -Path $target -File -ErrorAction SilentlyContinue)) {
              Write-Host "::error::nothing matched $target - this check would pass without reading anything"
              exit 1
            }
          }

          $files = @(Get-ChildItem -Path $targets -File)
          Write-Host "read $($files.Count) files"

          $hits = @($files | Select-String -Pattern '[A-Za-z]:\\(Users\\|scrcpy-win64)' -ErrorAction Stop)
          if ($hits) {
            foreach ($hit in $hits) {
              Write-Host "::error file=$($hit.Filename),line=$($hit.LineNumber)::absolute path: $($hit.Line.Trim())"
            }
            exit 1
          }
          Write-Host 'ok  nothing hardcoded'
